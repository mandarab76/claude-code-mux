# Google Vertex AI Studio Configuration Example
# Using Gemini models through OpenAI-compatible endpoint

[server]
port = 13456
host = "127.0.0.1"
log_level = "info"

[[providers]]
name = "vertex-ai"
provider_type = "vertex-ai"
api_key = "your-google-api-key-here"
enabled = true
models = []

# Model mappings for Gemini models
[[models]]
name = "gemini-2.5-flash"

[[models.mappings]]
actual_model = "gemini-2.5-flash"
priority = 1
provider = "vertex-ai"

[[models]]
name = "gemini-2.0-flash"

[[models.mappings]]
actual_model = "gemini-2.0-flash"
priority = 1
provider = "vertex-ai"

[[models]]
name = "gemini-1.5-pro"

[[models.mappings]]
actual_model = "gemini-1.5-pro"
priority = 1
provider = "vertex-ai"

[[models]]
name = "gemini-1.5-flash"

[[models.mappings]]
actual_model = "gemini-1.5-flash"
priority = 1
provider = "vertex-ai"

[router]
default = "gemini-2.5-flash"
background = "gemini-1.5-flash"
think = "gemini-1.5-pro"
websearch = "gemini-2.5-flash"

[server.timeouts]
connect_timeout_ms = 10000
api_timeout_ms = 600000
